[package]
name = "nprpc"
version = "1.0.0"
authors = ["James Munns <me@jamesmunns.com>"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/jamesmunns/nprpc"
description = "It's not Postcard-RPC"
license = "MPL-2.0"
categories = [
    "embedded",
    "no-std",
]
keywords = [
    "serde",
]
documentation = "https://docs.rs/nprpc/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
postcard.workspace = true
postcard-schema-ng.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

[features]
std = ["postcard-schema-ng/use-std"]
default = ["std"]
