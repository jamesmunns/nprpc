[package]
name = "nprpc"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = "1.1.3"
# branch: james/max-size-attempt-2
postcard-schema-ng = { git = "https://github.com/jamesmunns/postcard", rev = "8268690f0e237efb7a9c921f405ffa20c7534727", features = ["derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

[features]
std = ["postcard-schema-ng/use-std"]
default = ["std"]
